# Packs the `dotnet new` template (template/Vercuski.Vertical_Slice-Clean_Architecture.Templates.csproj)
# and verifies that the generated solution builds with zero warnings, passes its tests, leaks no
# template identity, keeps its solution file consistent with disk, and has not drifted from
# source/Vertical-Slice_Clean-Architecture.slnx. See template/verify-template.sh for the individual checks.
name: Template

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      # MinVer versions the package from git tags, so the full history is needed.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Pack template
        run: dotnet pack template/Vercuski.Vertical_Slice-Clean_Architecture.Templates.csproj --configuration Release --output artifacts

      - name: Upload template package
        uses: actions/upload-artifact@v7
        with:
          name: template-package
          path: artifacts/*.nupkg

  verify:
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The template has no options yet, so there is one case. When template.json gains symbols,
      # add a matrix entry per representative combination: { case: <name>, options: <dotnet new args> }.
        matrix:
            include:
              - case: defaults
                options: ''
              - case: efcore-sqlserver
                options: '--data-access EfCore --database SqlServer'
              - case: efcore-postgresql
                options: '--data-access EfCore --database PostgreSql'
              - case: efcore-mysql
                options: '--data-access EfCore --database MySql'
              - case: dapper-sqlserver
                options: '--data-access Dapper --database SqlServer'
              - case: dapper-postgresql
                options: '--data-access Dapper --database PostgreSql'
              - case: dapper-mysql
                options: '--data-access Dapper --database MySql'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download template package
        uses: actions/download-artifact@v8
        with:
          name: template-package
          path: artifacts

      - name: Install template
        run: dotnet new install artifacts/*.nupkg

      - name: Verify ${{ matrix.case }}
        # Invoked through bash so the check does not depend on the executable bit, which commits
        # made on Windows (core.fileMode=false) do not preserve.
        run: bash template/verify-template.sh ${{ matrix.case }} ${{ matrix.options }}
