<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580" role="img">
  <title>Vertical Slice + Clean Architecture template structure</title>
  <desc>Presentation.API holds the feature slices (endpoint, request/response, handler, validator) and depends on Infrastructure and Domain. Infrastructure holds versioning, health checks, correlation IDs and data access, and depends on Domain. Domain depends on nothing.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; dominant-baseline: central; }
    .th { font-size: 14px; font-weight: 600; }
    .ts { font-size: 12px; }
    .mid { text-anchor: middle; }
    .gray rect { fill: #F1EFE8; stroke: #5F5E5A; } .gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
    .purple rect { fill: #EEEDFE; stroke: #534AB7; } .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
    .teal rect { fill: #E1F5EE; stroke: #0F6E56; } .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
    .coral rect { fill: #FAECE7; stroke: #993C1D; } .coral .th { fill: #712B13; } .coral .ts { fill: #993C1D; }
    .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
    .note { fill: #5F5E5A; }
    @media (prefers-color-scheme: dark) {
      .gray rect { fill: #444441; stroke: #B4B2A9; } .gray .th { fill: #F1EFE8; } .gray .ts { fill: #D3D1C7; }
      .purple rect { fill: #3C3489; stroke: #AFA9EC; } .purple .th { fill: #EEEDFE; } .purple .ts { fill: #CECBF6; }
      .teal rect { fill: #085041; stroke: #5DCAA5; } .teal .th { fill: #E1F5EE; } .teal .ts { fill: #9FE1CB; }
      .coral rect { fill: #712B13; stroke: #F0997B; } .coral .th { fill: #FAECE7; } .coral .ts { fill: #F5C4B3; }
      .note { fill: #B4B2A9; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g class="gray">
    <rect x="40" y="30" width="580" height="220" rx="20" stroke-width="0.75"/>
    <text class="th" x="60" y="52">Presentation.API</text>
    <text class="ts" x="60" y="69">Vertical slices, one folder per feature</text>
  </g>
  <g class="purple">
    <rect x="60" y="85" width="160" height="145" rx="10" stroke-width="0.75"/>
    <text class="th mid" x="140" y="108">Feature slice A</text>
    <text class="ts mid" x="140" y="135">Endpoint</text>
    <text class="ts mid" x="140" y="160">Request / response</text>
    <text class="ts mid" x="140" y="185">Handler</text>
    <text class="ts mid" x="140" y="210">Validator</text>
  </g>
  <g class="purple">
    <rect x="240" y="85" width="160" height="145" rx="10" stroke-width="0.75"/>
    <text class="th mid" x="320" y="108">Feature slice B</text>
    <text class="ts mid" x="320" y="135">Endpoint</text>
    <text class="ts mid" x="320" y="160">Request / response</text>
    <text class="ts mid" x="320" y="185">Handler</text>
    <text class="ts mid" x="320" y="210">Validator</text>
  </g>
  <g class="purple">
    <rect x="420" y="85" width="160" height="145" rx="10" stroke-width="0.75"/>
    <text class="th mid" x="500" y="108">Feature slice C</text>
    <text class="ts mid" x="500" y="135">Endpoint</text>
    <text class="ts mid" x="500" y="160">Request / response</text>
    <text class="ts mid" x="500" y="185">Handler</text>
    <text class="ts mid" x="500" y="210">Validator</text>
  </g>

  <line x1="330" y1="252" x2="330" y2="286" class="arr" marker-end="url(#arrow)"/>

  <g class="teal">
    <rect x="40" y="290" width="580" height="120" rx="20" stroke-width="0.75"/>
    <text class="th" x="60" y="312">Infrastructure</text>
    <text class="ts" x="60" y="329">Cross-cutting concerns and data access</text>
  </g>
  <g class="gray">
    <rect x="60" y="347" width="120" height="44" rx="8" stroke-width="0.75"/>
    <text class="th mid" x="120" y="369">Versioning</text>
  </g>
  <g class="gray">
    <rect x="200" y="347" width="120" height="44" rx="8" stroke-width="0.75"/>
    <text class="th mid" x="260" y="369">Health checks</text>
  </g>
  <g class="gray">
    <rect x="340" y="347" width="120" height="44" rx="8" stroke-width="0.75"/>
    <text class="th mid" x="400" y="369">Correlation ID</text>
  </g>
  <g class="gray">
    <rect x="480" y="347" width="120" height="44" rx="8" stroke-width="0.75"/>
    <text class="th mid" x="540" y="369">Data access</text>
  </g>

  <line x1="330" y1="412" x2="330" y2="446" class="arr" marker-end="url(#arrow)"/>
  <path d="M620 140 L650 140 L650 490 L624 490" class="arr" marker-end="url(#arrow)"/>

  <g class="coral">
    <rect x="40" y="450" width="580" height="80" rx="20" stroke-width="0.75"/>
    <text class="th mid" x="330" y="478">Domain</text>
    <text class="ts mid" x="330" y="500">Entities, value objects, domain rules</text>
  </g>

  <text class="ts mid note" x="330" y="558">Arrows point to a dependency. Domain depends on nothing.</text>
</svg>
